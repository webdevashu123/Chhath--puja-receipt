services:
  - type: web
    name: chhath-puja-receipt
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN_HASH
        value: $2b$10$tAsGY5oFYr7ehZKA8HTVN.EBBudbBjpH5Aom1eiUzEnyojhO/iWYi
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_CLOUD_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: chhath_puja
